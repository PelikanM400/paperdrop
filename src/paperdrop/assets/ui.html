<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperDrop 纸落</title>
<style>
@font-face{font-family:"PaperDrop Source Han";src:url("__PAPERDROP_FONT_URL__") format("woff2");font-style:normal;font-weight:100 900;font-display:swap}
:root{color-scheme:light dark;--paper:#f5f5f1;--surface:#fdfdfa;--surface2:#ebece6;--ink:#30312d;--muted:#777a72;--line:#e1e3dc;--accent:#78866e;--accent-ink:#fff;--soft:#eef0e9;--good:#56735b;--bad:#ad514d;--warn:#9a6a25;--shadow:0 12px 32px #424b3510;--sans:"PaperDrop Source Han",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
html[data-theme="light"]{color-scheme:light;--paper:#f5f5f1;--surface:#fdfdfa;--surface2:#ebece6;--ink:#30312d;--muted:#777a72;--line:#e1e3dc;--accent:#78866e;--accent-ink:#fff;--soft:#eef0e9;--good:#56735b;--bad:#ad514d;--warn:#9a6a25;--shadow:0 12px 32px #424b3510}
html[data-theme="dark"]{color-scheme:dark;--paper:#262824;--surface:#30332e;--surface2:#3b3f38;--ink:#eeefe8;--muted:#b2b6aa;--line:#484d44;--accent:#a0af93;--accent-ink:#22271f;--soft:#373b34;--good:#a9c4a8;--bad:#e29a91;--warn:#e6c27e;--shadow:0 12px 32px #0003}
@media(prefers-color-scheme:dark){html[data-theme="system"]{--paper:#262824;--surface:#30332e;--surface2:#3b3f38;--ink:#eeefe8;--muted:#b2b6aa;--line:#484d44;--accent:#a0af93;--accent-ink:#22271f;--soft:#373b34;--good:#a9c4a8;--bad:#e29a91;--warn:#e6c27e;--shadow:0 12px 32px #0003}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);transition:background .2s,color .2s}button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
.wrap{max-width:920px;margin:auto;padding:24px 32px 22px}.top{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:28px}.switches{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.switches button,.refresh{height:32px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:12px}.switches button.active{background:var(--surface2);color:var(--ink)}.refresh{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;font-size:17px}.intro{margin:0 0 22px}.intro h1{font:600 30px/1.25 var(--sans);letter-spacing:0;margin:0}.intro .localized-cn{font-weight:500}.layout{display:grid;grid-template-columns:1fr;gap:14px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 24px}.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:15px}.section-title h2{font:600 18px/1.3 var(--sans);margin:0}.field{margin:0 0 16px}.field:last-child{margin-bottom:0}.field label,.select-row label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}.hint{font-size:12px;color:var(--muted);margin-top:6px}.time-row{display:flex;align-items:center;gap:14px}.time-row input.control{width:80px;min-width:80px;min-height:36px;padding:4px 5px;font-size:14px;font-variant-numeric:tabular-nums;text-align:center}.time-row input.control::-webkit-datetime-edit{width:100%;text-align:center}.time-row input.control::-webkit-datetime-edit-fields-wrapper{display:flex;justify-content:center;width:100%}.time-row input.control::-webkit-date-and-time-value{width:100%;text-align:center}.control{width:100%;min-height:42px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none}.control:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}.select-row select{max-width:100%;min-width:min(100%,360px);padding:9px 34px 9px 12px;font-size:12px}.select-row option{font-size:12px}.source-choice-hidden{display:none!important}.text-button{padding:0;border:0;background:none;color:var(--accent);font-size:13px}.text-button:hover{text-decoration:underline}.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.btn{width:140px;min-height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);font-size:13px}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}.btn.quiet{background:transparent;color:var(--muted)}button:disabled{opacity:.52;cursor:default}.action-note{font-size:12px;color:var(--muted);margin-left:4px}.quick-actions{display:flex;gap:8px;flex-wrap:wrap}.quick-actions .btn{width:140px}.advanced{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);padding:0 18px}.advanced summary{cursor:pointer;list-style:none;padding:14px 0;font-size:13px;color:var(--muted)}.advanced summary::-webkit-details-marker{display:none}.advanced summary:after{content:"＋";float:right;color:var(--accent)}.advanced[open] summary:after{content:"－"}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;padding:0 0 16px}.detail{display:flex;flex-direction:column;gap:3px;min-width:0}.detail span{font-size:12px;color:var(--muted)}.detail b{font-size:13px;font-weight:500;overflow-wrap:anywhere}.footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px;color:var(--muted);font-size:12px}.footer p{margin:0}.footer a{text-decoration:none}.footer a:hover{text-decoration:underline}.result{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px 20px;box-shadow:var(--shadow)}.result h2{font-size:15px;margin:0 0 9px}.result-body{font-size:13px}.ok{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--muted)}.change-list{margin:9px 0 0;padding-left:20px}.change-list li{margin:4px 0}.technical{margin-top:10px}.technical summary{cursor:pointer;color:var(--muted);font-size:12px}.technical table{margin-top:6px;width:100%;border-collapse:collapse;font-size:12px;overflow-wrap:anywhere}.technical td,.technical th{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line);vertical-align:top}.technical pre{max-height:220px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px}.notice{position:fixed;left:50%;bottom:18px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:999px;font-size:13px;transition:all .2s;max-width:calc(100vw - 32px);text-align:center}.notice.show{transform:translate(-50%,0);opacity:1}.hidden{display:none!important}
@media(max-width:640px){.wrap{padding:16px 16px 18px}.top{gap:5px;margin-bottom:25px}.switches{gap:1px}.switches button{padding:0 7px;font-size:11px}.intro h1{font-size:27px}.panel{padding:18px 17px}.details{grid-template-columns:1fr}.footer{align-items:flex-start;flex-direction:column;gap:5px}.action-note{width:100%;margin:2px 0 0}.select-row select{width:100%}.actions{gap:7px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top" aria-label="Display preferences">
  <div class="switches" role="group" aria-label="Language"><button data-lang="zh" class="active">中文</button><button data-lang="en">EN</button></div>
  <div class="switches" role="group" aria-label="Theme"><button data-theme-choice="light" data-zh="浅色" data-en="Light">浅色</button><button data-theme-choice="dark" data-zh="深色" data-en="Dark">深色</button><button data-theme-choice="system" class="active" data-zh="随系统" data-en="System">随系统</button></div>
  <button class="refresh" id="refresh" title="刷新" aria-label="刷新">↻</button>
</header>
<main>
<section class="intro"><h1>PaperDrop<span class="localized-cn" data-zh=" 纸落" data-en=""> 纸落</span></h1></section>
<div class="layout">
  <section class="panel time-panel">
    <div class="section-title"><h2 data-zh="每日更换" data-en="Daily change">每日更换</h2></div>
    <div class="field"><label for="time" data-zh="每日换壁纸时间" data-en="Daily wallpaper time">每日换壁纸时间</label><div class="time-row"><input id="time" class="control" type="time" lang="en-GB" step="60" value="07:35" aria-label="每日换壁纸时间"></div></div>
  </section>
  <section class="panel source-panel">
    <div class="section-title"><h2 data-zh="壁纸来源" data-en="Wallpaper source">壁纸来源</h2></div>
    <div class="field">
      <div class="select-row" id="preset-row"><label for="feed" data-zh="选择图源" data-en="Select a source">选择图源</label><select id="feed" class="control"></select></div>
      <div class="custom-choice" id="custom-choice"><button type="button" id="custom-toggle" class="text-button" data-zh="或使用自己的图源" data-en="Or use your own source">或使用自己的图源</button><div class="hint"><span data-zh="需提供公开可访问的 JSON 壁纸清单。" data-en="Provide a publicly accessible JSON wallpaper manifest.">需提供公开可访问的 JSON 壁纸清单。</span> <a href="https://github.com/PelikanM400/paperdrop/blob/main/docs/manifest-spec.md" target="_blank" rel="noreferrer" data-zh="查看格式要求 ↗" data-en="View format requirements ↗">查看格式要求 ↗</a></div></div>
      <div class="custom-source source-choice-hidden" id="custom-source"><label for="custom-url" data-zh="JSON 壁纸清单地址" data-en="JSON wallpaper manifest URL">JSON 壁纸清单地址</label><input id="custom-url" class="control" type="url" spellcheck="false" placeholder="https://…"><div class="hint"><span data-zh="清单需要图片地址和 SHA-256 校验值。" data-en="The manifest needs an image URL and SHA-256 hash.">清单需要图片地址和 SHA-256 校验值。</span> <a href="https://github.com/PelikanM400/paperdrop/blob/main/docs/manifest-spec.md" target="_blank" rel="noreferrer" data-zh="查看完整格式 ↗" data-en="View full format ↗">查看完整格式 ↗</a></div><button type="button" id="preset-toggle" class="text-button" style="margin-top:9px" data-zh="改用作者提供的图源" data-en="Use a built-in source">改用作者提供的图源</button></div>
    </div>
  </section>
  <section class="panel">
    <div class="actions"><button class="btn" id="check" data-zh="检查当前配置" data-en="Check these settings">检查当前配置</button><button class="btn primary" id="apply" disabled data-zh="应用变更" data-en="Apply changes">应用变更</button><button class="btn quiet" id="restore" data-zh="还原" data-en="Restore">还原</button><span class="action-note" id="apply-note" data-zh="先检查配置，再应用更改。" data-en="Check your settings before applying changes.">先检查配置，再应用更改。</span></div>
  </section>
  <section class="panel">
    <div class="section-title"><h2 data-zh="快捷操作" data-en="Quick actions">快捷操作</h2></div>
    <div class="quick-actions"><button class="btn" id="run" data-zh="立即检查" data-en="Check now">立即检查</button><button class="btn" id="update" data-zh="重新获取壁纸" data-en="Fetch wallpaper again">重新获取壁纸</button><button class="btn" id="pause" data-zh="暂停自动更换" data-en="Pause daily changes">暂停自动更换</button><button class="btn" id="resume" data-zh="恢复自动更换" data-en="Resume daily changes">恢复自动更换</button><button class="btn quiet" id="log" data-zh="查看运行记录" data-en="View activity log">查看运行记录</button></div>
  </section>
</div>
<details class="advanced"><summary><span data-zh="进阶配置和系统信息" data-en="Advanced settings & system information">进阶配置和系统信息</span></summary><div class="details" id="status"><div class="muted" data-zh="正在读取…" data-en="Loading…">正在读取…</div></div></details>
<section class="result hidden" id="result-card" aria-live="polite"><h2 id="result-title"></h2><div class="result-body" id="result-body"></div></section>
</main>
<footer class="footer"><p data-zh="PaperDrop 是一个开源小项目，让每日换壁纸简单一些。" data-en="A small open-source project to make daily wallpaper changes simpler.">PaperDrop 是一个开源小项目，让每日换壁纸简单一些。</p><a href="https://github.com/PelikanM400/paperdrop" target="_blank" rel="noreferrer">GitHub ↗</a></footer>
</div>
<div class="notice" id="notice" role="status"></div>
<script>
const TOKEN=new URLSearchParams(location.search).get('t')||'';
const PRESETS=__PRESETS__;
let CURRENT=null,PREVIEWED=null,BUSY=false,LANG='zh',CUSTOM_MODE=false,DRAFT_REVISION=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=(zh,en)=>LANG==='zh'?zh:en;
function api(path,body){const url=path+(path.includes('?')?'&':'?')+'t='+encodeURIComponent(TOKEN);const options=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{};return fetch(url,options).then(async r=>{let data;try{data=await r.json()}catch(e){throw new Error('HTTP '+r.status)}if(!r.ok)throw new Error(data.error||('HTTP '+r.status));return data})}
function showNotice(zh,en){const node=$('notice');node.textContent=text(zh,en);node.classList.add('show');setTimeout(()=>node.classList.remove('show'),2200)}
function showResult(title,html){$('result-title').textContent=title;$('result-body').innerHTML=html;$('result-card').classList.remove('hidden')}
function setBusy(value){BUSY=value;document.querySelectorAll('input,select').forEach(control=>{control.disabled=value});document.querySelectorAll('button').forEach(button=>{if(button.id!=='refresh'&&button.dataset.lang===undefined&&button.dataset.themeChoice===undefined)button.disabled=value});if(!value)$('apply').disabled=!PREVIEWED}
function invalidate(){DRAFT_REVISION++;PREVIEWED=null;$('apply').disabled=true;$('apply-note').textContent=text('修改后请重新检查配置。','Check your settings again after making changes.')}
// A revision rejects edit-and-revert/refresh races; values also catch changes without DOM events.
function matchesDraft(body,revision=DRAFT_REVISION,custom=CUSTOM_MODE){return revision===DRAFT_REVISION&&custom===CUSTOM_MODE&&body.daily_time===$('time').value&&body.source_url===selectedSource()}
function setLanguage(language){LANG=language;document.documentElement.lang=language==='zh'?'zh-CN':'en';document.title=language==='zh'?'PaperDrop 纸落':'PaperDrop';document.querySelectorAll('[data-zh][data-en]').forEach(node=>{node.textContent=node.dataset[language]});document.querySelectorAll('[data-lang]').forEach(node=>node.classList.toggle('active',node.dataset.lang===language));$('time').setAttribute('aria-label',text('每日换壁纸时间','Daily wallpaper time'));if(CURRENT)renderStatus(CURRENT,false);$('apply-note').textContent=PREVIEWED?text('检查通过，可以应用更改。','Settings checked. You can apply the changes.'):text('先检查配置，再应用更改。','Check your settings before applying changes.')}
function setTheme(theme){document.documentElement.dataset.theme=theme;document.querySelectorAll('[data-theme-choice]').forEach(node=>node.classList.toggle('active',node.dataset.themeChoice===theme));try{localStorage.setItem('paperdrop-theme',theme)}catch(e){}}
function switchSourceMode(custom){if(CUSTOM_MODE!==custom)invalidate();CUSTOM_MODE=custom;$('preset-row').classList.toggle('source-choice-hidden',custom);$('custom-choice').classList.toggle('source-choice-hidden',custom);$('custom-source').classList.toggle('source-choice-hidden',!custom)}
function selectedSource(){if(CUSTOM_MODE)return $('custom-url').value.trim();const item=PRESETS[Number($('feed').value)];return item?item[1]:''}
function renderStatus(status,resetForm=true){CURRENT=status;const sourceUrl=status.source.url;if(resetForm){const presetIndex=PRESETS.findIndex(item=>item[1]===sourceUrl);if(presetIndex>=0){$('feed').value=String(presetIndex);switchSourceMode(false)}else{$('custom-url').value=sourceUrl;switchSourceMode(true)}$('time').value=status.schedule.daily_time;invalidate()}const state=status.state||{},success=state.last_success||{},attempt=state.last_attempt||{};const scheduleText={'已启用':'Enabled','已停止':'Stopped','已暂停':'Paused','未知':'Unknown','未知（该平台不支持查询）':'Unavailable on this platform'};const rows=[['版本',status.version],['配置文件',status.config_path],['图源',sourceUrl],['每日换壁纸时间',status.schedule.daily_time],['定时任务',LANG==='zh'?status.schedule_state:(scheduleText[status.schedule_state]||status.schedule_state)],['运行平台',status.platform],['上次成功',success.local_date||'—'],['上次检查',attempt.local_date||'—']];$('status').innerHTML=rows.map(([key,value])=>'<div class="detail"><span>'+esc(LANG==='zh'?key:({版本:'Version',配置文件:'Configuration file',图源:'Wallpaper source',每日换壁纸时间:'Daily wallpaper time',定时任务:'Scheduled task',运行平台:'Platform',上次成功:'Last successful change',上次检查:'Last check'}[key]||key))+'</span><b>'+esc(value)+'</b></div>').join('')}
async function loadStatus(){invalidate();const revision=DRAFT_REVISION;try{const status=await api('/api/status');if(revision===DRAFT_REVISION)renderStatus(status)}catch(error){if(revision===DRAFT_REVISION)showResult(text('读取状态失败','Could not read status'),'<p class="bad">'+esc(error.message)+'</p>')}}
function populatePresets(){ $('feed').innerHTML=PRESETS.map((item,index)=>'<option value="'+index+'" data-zh="'+esc(item[0])+'" data-en="'+esc(item[2])+'">'+esc(LANG==='zh'?item[0]:item[2])+'</option>').join('') }
function setLanguageAndOptions(language){setLanguage(language);Array.from($('feed').options).forEach(option=>{option.textContent=option.dataset[language]})}
function renderCheck(result,body,revision=DRAFT_REVISION,custom=CUSTOM_MODE){if(!matchesDraft(body,revision,custom))return;const okay=Boolean(result.ok&&result.source_check&&result.source_check.ok);let html='<p class="'+(okay?'ok':'bad')+'">'+(okay?text('检查通过，JSON 清单可用。','Check passed. The JSON manifest is available.'):text('检查未通过，请查看原因。','Check failed. See the details below.'))+'</p>';if(result.changes&&result.changes.length){html+='<p class="muted">'+text('待应用的更改：','Changes to apply:')+'</p><ul class="change-list">'+result.changes.map(change=>'<li>'+esc(change[0])+': <code>'+esc(change[1]||'—')+'</code> → <code>'+esc(change[2]||'—')+'</code></li>').join('')+'</ul>'}else if(okay){html+='<p class="muted">'+text('设置没有变化。','There are no changes to apply.')+'</p>'}if(result.messages&&result.messages.length){html+='<ul class="change-list">'+result.messages.filter(item=>item.level==='error').map(item=>'<li class="bad">'+esc(item.text)+'</li>').join('')+'</ul>'}if(result.source_check&&result.source_check.rows&&result.source_check.rows.length){html+='<details class="technical"><summary>'+text('查看清单检查详情','View manifest check details')+'</summary><table>'+result.source_check.rows.map(row=>'<tr><th>'+esc(row[0])+'</th><td>'+esc(row[1])+'</td></tr>').join('')+'</table></details>'}showResult(text('配置检查','Settings check'),html);PREVIEWED=okay&&result.changes&&result.changes.length?body:null;$('apply').disabled=!PREVIEWED;$('apply-note').textContent=PREVIEWED?text('检查通过，可以应用更改。','Settings checked. You can apply the changes.'):text('先检查配置，再应用更改。','Check your settings before applying changes.')}
$('feed').addEventListener('change',invalidate);$('custom-url').addEventListener('input',invalidate);$('time').addEventListener('input',invalidate);$('time').addEventListener('change',invalidate);
$('custom-toggle').onclick=()=>{if(!CUSTOM_MODE)$('custom-url').value='';switchSourceMode(true);invalidate()};$('preset-toggle').onclick=()=>{switchSourceMode(false);invalidate()};
$('refresh').onclick=loadStatus;$('restore').onclick=()=>{if(CURRENT)renderStatus(CURRENT)};
$('check').onclick=async()=>{if(BUSY)return;const body={daily_time:$('time').value,source_url:selectedSource()};invalidate();if(!body.source_url){showNotice('请填写 JSON 清单地址。','Enter a JSON manifest URL.');return}const revision=DRAFT_REVISION,custom=CUSTOM_MODE;setBusy(true);try{const result=await api('/api/check-preview',body);renderCheck(result,body,revision,custom)}catch(error){if(matchesDraft(body,revision,custom)){invalidate();showResult(text('检查失败','Check failed'),'<p class="bad">'+esc(error.message)+'</p>')}}finally{setBusy(false)}};
$('apply').onclick=async()=>{if(BUSY||!PREVIEWED)return;if(!matchesDraft(PREVIEWED)){invalidate();return}const confirmed=confirm(text('确认应用已检查的更改？','Apply the checked changes?'));if(!confirmed)return;setBusy(true);try{const result=await api('/api/apply',PREVIEWED);const success=result.ok;let html='<p class="'+(success?'ok':'bad')+'">'+(success?text('更改已应用。','Changes applied.'):esc(result.error||'Failed'))+'</p>';if(result.install&&result.install.output)html+='<details class="technical"><summary>'+text('查看结果','View details')+'</summary><pre>'+esc(result.install.output)+'</pre></details>';showResult(text('应用结果','Apply result'),html);await loadStatus()}catch(error){showResult(text('应用失败','Apply failed'),'<p class="bad">'+esc(error.message)+'</p>')}finally{setBusy(false)}};
$('run').onclick=()=>runAction('/api/run',{force:false},'已完成','Finished');$('update').onclick=()=>runAction('/api/run',{force:true},'已重新获取','Fetched again');$('pause').onclick=()=>runAction('/api/schedule',{action:'pause'},'已暂停自动更换','Daily changes paused');$('resume').onclick=()=>runAction('/api/schedule',{action:'resume'},'已恢复自动更换','Daily changes resumed');
async function runAction(path,body,zh,en){setBusy(true);try{const result=await api(path,body);const okay=Boolean(result.ok);let html='<p class="'+(okay?'ok':'bad')+'">'+esc(result.summary||text(zh,en))+'</p>';if(result.output)html+='<details class="technical"><summary>'+text('查看运行详情','View run details')+'</summary><pre>'+esc(result.output)+'</pre></details>';showResult(text('快捷操作','Quick action'),html);await loadStatus()}catch(error){showResult(text('操作失败','Action failed'),'<p class="bad">'+esc(error.message)+'</p>')}finally{setBusy(false)}}
$('log').onclick=async()=>{setBusy(true);try{const result=await api('/api/log?lines=200');showResult(text('运行记录','Activity log'),'<pre class="technical">'+esc(result.text||text('暂无记录。','No activity recorded.'))+'</pre>')}catch(error){showResult(text('读取记录失败','Could not read activity log'),'<p class="bad">'+esc(error.message)+'</p>')}finally{setBusy(false)}};
PRESETS.forEach((item,index)=>{if(!item[2])item[2]=item[0]});populatePresets();
document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{localStorage.setItem('paperdrop-language',button.dataset.lang);setLanguageAndOptions(button.dataset.lang)}));document.querySelectorAll('[data-theme-choice]').forEach(button=>button.addEventListener('click',()=>setTheme(button.dataset.themeChoice)));
try{const storedLanguage=localStorage.getItem('paperdrop-language');if(storedLanguage==='en'||storedLanguage==='zh')LANG=storedLanguage;const storedTheme=localStorage.getItem('paperdrop-theme');if(['light','dark','system'].includes(storedTheme))document.documentElement.dataset.theme=storedTheme}catch(e){}
setLanguageAndOptions(LANG);setTheme(document.documentElement.dataset.theme||'system');loadStatus();
</script>
